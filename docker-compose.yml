services:
  mongo:
    image: mongo:7
    container_name: flowops-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowops-redis
    profiles: ['redis']
    ports:
      - '6379:6379'

volumes:
  mongo-data:
